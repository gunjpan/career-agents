[project]
name = "jobagent"
version = "0.1.0"
description = "Multi-agent job search pipeline with a human-approved submit"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "gspread>=6.1",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "typer>=0.12",
    "rich>=13.7",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "anthropic>=1.11.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
]

[project.scripts]
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
