# Scorer settings. Model IDs and prices live here, never in code.

model: claude-haiku-4-5
prompt: prompts/scorer.md
max_tokens: 1500
temperature: 0           # same posting, same score as far as possible
max_description_chars: 12000

# USD per million tokens. Keep in sync with Anthropic's price list; used for cost logging
# and the spend cap. cache_read / cache_write are the prompt-caching rates.
pricing_usd_per_mtok:
  claude-haiku-4-5: {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}

# A job is shortlisted when ALL of these hold. Decided in code from the Scorer's output,
# so you can change thresholds without touching the prompt.
shortlist:
  min_fit: 70
  levels: [senior_manager, director, vp]
  functions: [engineering, ai_data, security, it_operations]

# Stop scoring once a run has spent this much. Remaining jobs stay `filtered` for next time.
max_run_cost_usd: 1.00
