# Hard filters. Plain regex/date checks that run before any LLM call.
# Real level classification (Sr Manager / Director / VP) is the Scorer's job, not this file's.

locations:
  # A posting passes if ANY of its locations matches one of these.
  include_patterns:
    - '\bToronto\b'
    - '\bGTA\b'
    - '\bGreater Toronto'
    - '\b(Mississauga|Brampton|Markham|Vaughan|Richmond Hill|Oakville|Burlington|Pickering|Ajax|Whitby|Oshawa|Etobicoke|Scarborough|North York|Waterloo)\b'
    - '\bOntario\b'
    - ',\s*ON\b'
  allow_remote: true
  # Remote/hybrid roles pass if they name one of these countries...
  remote_country_patterns:
    - '\bCanada\b'
  # ...or name no country at all (kept and flagged), unless they mention a foreign marker.
  foreign_markers:
    - '\b(United States|USA|U\.S\.|US)\b'
    - '\b(United Kingdom|UK|Ireland|India|Singapore|Australia|Germany|France|Netherlands)\b'
    - '\b(EMEA|APAC|LATAM)\b'

# Rules: one filter each, as data. Fields: title | department | company | workplace_type.
# `match` is a case-insensitive regex. Actions:
#   exclude - reject the posting when it matches
#   include - if any include rule applies to a field, at least one must match
#   flag    - keep the posting but add "flag:<name>" to its flags column
# `companies` (optional) scopes a rule to those companies; omit it to apply to all.
# Postings with an empty field are never dropped by include rules; they get "<field>_unknown".
# The run summary counts rejections per rule name, so you can see what each rule hides.
rules:
  - name: no-inflated-vp-titles   # banks' "Assistant VP, Lead Developer" is not a leadership role
    field: title
    match: 'assistant vice[- ]president|associate vice[- ]president|\bAVP\b'
    action: exclude

  - name: no-lead-developer-titles   # "Associate Director - Reporting Lead Developer" is an IC role
    field: title
    match: '\blead (developer|engineer)\b'
    action: exclude

  - name: leadership-titles-only
    field: title
    match: 'senior manager|sr\.? manager|director|vice[- ]president|\bVP\b|\bSVP\b|\bEVP\b|head of|\bchief\b'
    action: include

  - name: engineering-manager-titles   # include rules on one field are alternatives
    field: title
    match: '\b(engineering|technology|software|data|platform|AI|security|infrastructure|cloud|devops)\s+manager\b|\bmanager,?\s+(of\s+)?(engineering|technology|software|data|platform|AI|security|infrastructure|cloud|devops)\b'
    action: include

  - name: wealthsimple-only-data-engineering
    field: department
    match: 'data (&|and) engineering'
    action: include
    companies: [Wealthsimple]

  - name: contract-role   # keep, but make fixed-term roles visible in the Jobs tab
    field: title
    match: '\b(contract|temporary|fixed[- ]term|CDD)\b|contrat à durée'
    action: flag

# For ATSs that need a search query (Workday). Boards that list everything ignore this.
discovery:
  country: Canada
  # Inclusive on purpose: a family filter hides postings silently, so keep adjacent families
  # and let the Scorer handle the noise. Not covered: e.g. BMO "Strategy & Change".
  job_family_patterns:
    - technology
    - information technology
    - artificial intelligence
    - '\bdata\b'
    - analytics
    - digital
  search_terms:
    - director
    - vice president
    - senior manager
    - head of

max_age_days: 30
keep_undated: true
